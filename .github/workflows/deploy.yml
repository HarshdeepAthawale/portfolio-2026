name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    # Admin image uploads go live with the next publish, so upload-only commits don't deploy.
    paths-ignore: ["public/assets/uploads/**"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write # report deploy state on each commit

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 194b8e44e64c7b9b02601686eb491c11
      # Build-time data for prerendered pages (GitHub stats, Spotify fallback).
      GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Mark deploy pending
        run: gh api repos/${{ github.repository }}/statuses/${{ github.sha }} -f state=pending -f context=cloudflare -f description="Deploying to Cloudflare"
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: npm ci
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply harshdeepathawale-db --remote
      - name: Build and deploy
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
      - name: Report result
        if: always()
        run: gh api repos/${{ github.repository }}/statuses/${{ github.sha }} -f state=${{ job.status == 'success' && 'success' || 'failure' }} -f context=cloudflare -f description="Cloudflare deploy ${{ job.status }}"
        env: { GH_TOKEN: "${{ github.token }}" }
